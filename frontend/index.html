<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Senhas - E6-FILA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Lado Esquerdo: Senha Atual Chamada */
        .main-display {
            flex: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-right: 4px solid #334155;
            padding: 20px;
        }

        .title {
            font-size: 2rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .ticket-number {
            font-size: 9rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            margin: 10px 0;
        }

        .ticket-type {
            font-size: 2.5rem;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-prioritaria {
            background-color: #ef4444;
            color: #ffffff;
        }

        .type-comum {
            background-color: #22c55e;
            color: #ffffff;
        }

        /* Lado Direito: Histórico das Últimas Senhas */
        .history-panel {
            flex: 1;
            background-color: #1e293b;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
        }

        .history-title {
            font-size: 1.8rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #334155;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .history-item.prioritaria {
            border-left: 6px solid #ef4444;
        }

        .history-item.comum {
            border-left: 6px solid #22c55e;
        }

        .no-data {
            font-size: 2rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-display">
        <div class="title">SENHA ATUAL</div>
        <div id="senha-atual" class="ticket-number">---</div>
        <div id="tipo-badge" class="ticket-type" style="display: none;">---</div>
    </div>

    <div class="history-panel">
        <div class="history-title">Últimas Chamadas</div>
        <ul id="historico-lista" class="history-list">
            <li class="history-item no-data">Aguardando senhas...</li>
        </ul>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/painel/atual';

        async function buscarAtualizacoes() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // 1. Atualiza Senha Principal
                const elAtual = document.getElementById('senha-atual');
                const elBadge = document.getElementById('tipo-badge');

                if (data.atual) {
                    elAtual.innerText = data.atual.codigo;
                    elBadge.innerText = data.atual.tipo.toUpperCase();
                    elBadge.className = `ticket-type type-${data.atual.tipo}`;
                    elBadge.style.display = 'inline-block';
                } else {
                    elAtual.innerText = '---';
                    elBadge.style.display = 'none';
                }

                // 2. Atualiza Histórico Recente
                const elHistorico = document.getElementById('historico-lista');
                elHistorico.innerHTML = '';

                if (data.historico && data.historico.length > 0) {
                    data.historico.forEach(item => {
                        const li = document.createElement('li');
                        li.className = `history-item ${item.tipo}`;
                        li.innerHTML = `
                            <span>${item.codigo}</span>
                            <small style="font-size: 1rem; color: #94a3b8;">${item.tipo}</small>
                        `;
                        elHistorico.appendChild(li);
                    });
                } else {
                    elHistorico.innerHTML = '<li class="history-item no-data">Sem histórico</li>';
                }

            } catch (error) {
                console.error('Erro ao conectar com a API:', error);
            }
        }

        // Executa a busca inicial e depois a cada 3 segundos
        buscarAtualizacoes();
        setInterval(buscarAtualizacoes, 3000);
    </script>
</body>
</html>
