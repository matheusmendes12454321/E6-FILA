<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem de Senhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-6">

    <header class="text-center py-4">
        <h1 class="text-3xl font-extrabold tracking-wider text-blue-400">BEM-VINDO(A)</h1>
        <p class="text-slate-400 text-sm mt-1">Selecione o tipo de atendimento para retirar sua senha</p>
    </header>

    <div id="cardSenhaEmitida" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white text-slate-800 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-blue-500 animate-bounce-short">
            <span class="text-xs font-bold text-slate-400 tracking-widest uppercase">Sua Senha é</span>
            <div id="codigoEmitido" class="text-6xl font-black text-blue-600 my-4 tracking-tight">---</div>
            <div id="tipoEmitido" class="text-sm font-semibold uppercase text-slate-500 bg-slate-100 py-1 px-3 rounded-full inline-block">--</div>
            <p class="text-xs text-slate-400 mt-6">Por favor, aguarde a chamada no painel.</p>
        </div>
    </div>

    <main class="max-w-2xl w-full mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 my-auto">
        <button onclick="gerarSenha('comum')" 
            class="bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-blue-500 rounded-3xl p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:scale-105 shadow-xl group">
            <div class="bg-blue-500/10 text-blue-400 p-5 rounded-2xl group-hover:bg-blue-500 group-hover:text-white transition-all">
                <i class="fa-solid fa-user text-4xl"></i>
            </div>
            <div class="text-center">
                <span class="text-xl font-bold block">Atendimento Comum</span>
                <span class="text-xs text-slate-400 mt-1 block">Fila convencional</span>
            </div>
        </button>

        <button onclick="gerarSenha('prioritaria')" 
            class="bg-slate-800 hover:bg-slate-700 border-2 border-slate-700 hover:border-amber-500 rounded-3xl p-8 flex flex-col items-center justify-center gap-4 transition-all duration-300 hover:scale-105 shadow-xl group">
            <div class="bg-amber-500/10 text-amber-400 p-5 rounded-2xl group-hover:bg-amber-500 group-hover:text-white transition-all">
                <i class="fa-solid fa-hands-holding-child text-4xl"></i>
            </div>
            <div class="text-center">
                <span class="text-xl font-bold block text-amber-400">Atendimento Prioritário</span>
                <span class="text-xs text-slate-400 mt-1 block">Gestantes, idosos e PCD</span>
            </div>
        </button>
    </main>

    <footer class="text-center text-xs text-slate-500 py-2">
        Sistema de Gerenciamento de Filas &bull; Terminal Totem
    </footer>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';

        async function gerarSenha(tipo) {
            try {
                const response = await fetch(`${API_URL}/eventos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo })
                });

                const data = await response.json();

                if (response.ok) {
                    exibirSenha(data.senha.codigo, data.senha.tipo);
                } else {
                    alert('Erro ao emitir senha: ' + (data.message || 'Falha no servidor'));
                }
            } catch (error) {
                alert('Erro de conexão ao tentar emitir senha.');
            }
        }

        function exibirSenha(codigo, tipo) {
            document.getElementById('codigoEmitido').textContent = codigo;
            document.getElementById('tipoEmitido').textContent = tipo === 'prioritaria' ? 'Prioritária' : 'Comum';
            
            const modal = document.getElementById('cardSenhaEmitida');
            modal.classList.remove('hidden');

            // Esconde o modal automaticamente após 4 segundos
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 4000);
        }
    </script>
</body>
</html>
