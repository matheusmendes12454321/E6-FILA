<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Atendente - Sistema de Filas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-slate-800 text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Painel do Atendente</h1>
                <p class="text-xs text-slate-400">Guichê 01 - Atendimento Geral</p>
            </div>
            <span id="statusBadge" class="bg-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">
                Livre
            </span>
        </div>

        <div class="p-6 space-y-6">
            
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 text-center shadow-inner">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest block mb-1">Senha em Foco</span>
                <div id="displayCodigo" class="text-6xl font-black text-slate-800 tracking-tight my-2">--</div>
                <div id="displayTipo" class="inline-block bg-slate-200 text-slate-600 text-xs px-3 py-1 rounded-md font-medium uppercase">
                    Aguardando chamada
                </div>
            </div>

            <div id="mensagemAviso" class="hidden p-3 rounded-lg text-sm font-medium text-center"></div>

            <button id="btnChamar" onclick="chamarProxima()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 text-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">
                <i class="fa-solid font-bold fa-bullhorn"></i>
                <span>Chamar Próxima Senha</span>
            </button>

            <div class="grid grid-cols-3 gap-3 pt-2">
                <button id="btnIniciar" onclick="iniciarAtendimento()" disabled
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-2 rounded-lg text-sm transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-play"></i>
                    <span>Iniciar</span>
                </button>

                <button id="btnFinalizar" onclick="finalizarAtendimento()" disabled
                    class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-2 rounded-lg text-sm transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-check"></i>
                    <span>Finalizar</span>
                </button>

                <button id="btnAusente" onclick="marcarAusente()" disabled
                    class="bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 px-2 rounded-lg text-sm transition-all flex flex-col items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-user-xmark"></i>
                    <span>Ausente</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api';
        let senhaAtual = null; // Armazena o objeto da senha ativa no momento

        // Atualiza a interface com base no estado do atendimento
        function atualizarUI() {
            const btnChamar = document.getElementById('btnChamar');
            const btnIniciar = document.getElementById('btnIniciar');
            const btnFinalizar = document.getElementById('btnFinalizar');
            const btnAusente = document.getElementById('btnAusente');
            const statusBadge = document.getElementById('statusBadge');
            const displayCodigo = document.getElementById('displayCodigo');
            const displayTipo = document.getElementById('displayTipo');
            const mensagemAviso = document.getElementById('mensagemAviso');

            if (!senhaAtual) {
                // Estado: Sem senha em atendimento (Livre)
                btnChamar.disabled = false;
                btnIniciar.disabled = true;
                btnFinalizar.disabled = true;
                btnAusente.disabled = true;

                statusBadge.textContent = "Livre";
                statusBadge.className = "bg-slate-700 text-slate-300 text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider";
                
                displayCodigo.textContent = "--";
                displayTipo.textContent = "Aguardando chamada";
                
                exibirAviso("Pronto para chamar a próxima senha.", "info");
            } else {
                // Existe uma senha em andamento: TRAVA o botão de chamar nova
                btnChamar.disabled = true;
                displayCodigo.textContent = senhaAtual.codigo;
                displayTipo.textContent = senhaAtual.tipo;

                if (senhaAtual.status === 'chamada') {
                    statusBadge.textContent = "Chamada";
                    statusBadge.className = "bg-amber-500 text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider";
                    
                    btnIniciar.disabled = false;
                    btnFinalizar.disabled = true;
                    btnAusente.disabled = false;
                    
                    exibirAviso("Senha chamada! Inicie o atendimento ou marque como ausente.", "alerta");
                } else if (senhaAtual.status === 'em_atendimento') {
                    statusBadge.textContent = "Em Atendimento";
                    statusBadge.className = "bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider";
                    
                    btnIniciar.disabled = true;
                    btnFinalizar.disabled = false;
                    btnAusente.disabled = false;

                    exibirAviso("Atendimento em andamento. Finalize para liberar novas chamadas.", "sucesso");
                }
            }
        }

        function exibirAviso(texto, tipo) {
            const el = document.getElementById('mensagemAviso');
            el.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-amber-50', 'text-amber-700', 'bg-emerald-50', 'text-emerald-700');
            
            if (tipo === 'info') el.classList.add('bg-blue-50', 'text-blue-700');
            if (tipo === 'alerta') el.classList.add('bg-amber-50', 'text-amber-700');
            if (tipo === 'sucesso') el.classList.add('bg-emerald-50', 'text-emerald-700');
            
            el.textContent = texto;
        }

        // 1. Chamar Próxima
        async function chamarProxima() {
            if (senhaAtual) return; // Trava de segurança extra

            try {
                const res = await fetch(`${API_URL}/senhas/chamar-proxima`, { method: 'POST' });
                const data = await res.json();

                if (res.ok) {
                    senhaAtual = { ...data.senha, status: 'chamada' };
                    atualizarUI();
                } else {
                    alert(data.message || 'Nenhuma senha na fila.');
                }
            } catch (err) {
                alert('Erro ao comunicar com o servidor.');
            }
        }

        // 2. Iniciar Atendimento
        async function iniciarAtendimento() {
            if (!senhaAtual) return;

            try {
                const res = await fetch(`${API_URL}/senhas/${senhaAtual.id}/iniciar`, { method: 'PUT' });
                if (res.ok) {
                    senhaAtual.status = 'em_atendimento';
                    atualizarUI();
                }
            } catch (err) {
                alert('Erro ao iniciar atendimento.');
            }
        }

        // 3. Finalizar Atendimento (Libera a trava)
        async function finalizarAtendimento() {
            if (!senhaAtual) return;

            try {
                const res = await fetch(`${API_URL}/senhas/${senhaAtual.id}/finalizar`, { method: 'PUT' });
                if (res.ok) {
                    senhaAtual = null; // Reseta a senha ativa
                    atualizarUI();
                }
            } catch (err) {
                alert('Erro ao finalizar atendimento.');
            }
        }

        // 4. Marcar Ausente (Libera a trava)
        async function marcarAusente() {
            if (!senhaAtual) return;

            try {
                const res = await fetch(`${API_URL}/senhas/${senhaAtual.id}/ausente`, { method: 'PUT' });
                if (res.ok) {
                    senhaAtual = null; // Reseta a senha ativa
                    atualizarUI();
                }
            } catch (err) {
                alert('Erro ao marcar ausência.');
            }
        }

        // Inicializa o painel
        atualizarUI();
    </script>
</body>
</html>
